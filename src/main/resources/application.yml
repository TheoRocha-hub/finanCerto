spring:
  application:
    name: financerto
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

---
# Perfil dev: banco H2 em memória (nada para instalar)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:financerto;DB_CLOSE_DELAY=-1
    username: sa
    password:

---
# Perfil prod: PostgreSQL, configurado por variáveis de ambiente (no OpenShift).
# DB_HOST = nome do Service do Postgres. DB_PASSWORD NÃO tem valor padrão de propósito:
# deve vir de um Secret; se faltar, a aplicação não sobe (melhor do que usar senha fraca).
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:financerto}
    username: ${DB_USER:financerto}
    password: ${DB_PASSWORD}
